<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=t=>String(t||'').split(/\n+/).filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join('');
const APP_VERSION='2.0.1 DEMO';
const DEMO_MODE=true; // Demo visual: no PHP, no SQLite, no GitHub writes
const mkey=t=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(t);
const todayKey=()=>mkey(Date.now()-60000); // el día cambia a las 00:01 (hora de España)
const fmtLong=k=>{const d=new Date(k+'T12:00:00Z').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});return d.charAt(0).toUpperCase()+d.slice(1)};

const DEF={version:2,updated:'',visibilidad:{inicio:true,nosotros:true,carta:true,galeria:true,contacto:true,menuDia:true,precios:true,redes:true},
 inicio:{

  carta:{title:'Carta',text:'Nuestra carta se basa en cocina casera con productos frescos. Consulta cada día el menú del día.',
   cards:[{image:'',title:'Comida casera'},{image:'',title:'Desayunos y meriendas'},{image:'',title:'Cafés y copas'}],button:'Ver carta'},
  strip:[],
  galeriaTitle:'Nuestra galería fotográfica'},
 carta:{title:'Menú Portosín',menus:{}},
 galeria:{items:[]},

};
const clone=o=>JSON.parse(JSON.stringify(o));
const merge=(d,s)=>{if(Array.isArray(d)||typeof d!=='object'||d===null)return s===undefined?d:s;const o={};for(const k of new Set([...Object.keys(d),...Object.keys(s||{})]))o[k]=k in d?merge(d[k],s?s[k]:undefined):s[k];return o};

const sp=(o,p,v)=>{const k=p.split('.'),l=k.pop();const t=k.reduce((a,x)=>a[x],o);t[l]=v};

const PATH='data.json';let timer=null,pushing=false,again=false,CONF={repo:'elquintero/portosin-data',branch:'main'};
const repo=()=>cfg.repo||CONF.repo;
const isAdmin=()=>serverAdmin;
const vis=k=>S.visibilidad?.[k]!==false;
const apiPost=async body=>{
 if(!DEMO_MODE)throw new Error('Esta demo no tiene conexión con el servidor.');
 if(body.action==='auth'){if(body.password!=='demo')throw new Error('En la demo, la contraseña es: demo');serverAdmin=true;return {ok:true}}

  <h4>Título de la carta</h4>${F('Título','carta.title')}
  <div style="margin-top:14px"><button class="sm" data-mk="prune">Borrar menús de días pasados</button></div>
  <h4>Imagen para WhatsApp</h4>${m?`<p style="margin:6px 0 10px;color:var(--mut);font-size:.9rem">Crea una imagen vertical (formato estado) con el menú del ${esc(fmtLong(selD))}.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sm" data-mkimg="dl">Descargar imagen del menú</button>${canShareImg()?'<button class="sm" data-mkimg="share">Compartir…</button>':''}</div><div id="mprev" style="display:none;margin-top:12px"><img id="mimg" alt="Vista previa del menú" style="max-width:260px;width:100%;border:1px solid var(--line);border-radius:8px"></div>`:'<p style="color:var(--mut);font-size:.9rem">Crea primero el menú de este día para generar su imagen.</p>'}`}
 if(tab==='galeria')return `<div class="tip">Las fotos se optimizan y se guardan como archivos independientes en /imagenes/.</div><button class="sm" id="addg">+ Añadir fotos</button><div class="gl">${S.galeria.items.map((s,n)=>`<div><img src="${esc(s)}" alt="" loading="lazy"><span><button data-g="l" data-i="${n}" aria-label="Mover antes">←</button><button data-g="d" data-i="${n}" aria-label="Quitar">✕</button><button data-g="r" data-i="${n}" aria-label="Mover después">→</button></span></div>`).join('')}</div>`;
 if(tab==='contacto'){const c='contacto.';return F('Título',c+'titulo')+F('Texto',c+'texto',{ta:1})+F('Dirección',c+'direccion',{ta:1})+F('Horario',c+'horario',{ta:1})+F('Teléfono',c+'telefono')+F('Email',c+'email')+F('Facebook (URL)',c+'facebook')+F('Instagram (URL)',c+'instagram')}
 return `${!isAdmin()?`<div class="tip">Modo demostración: puedes explorar el administrador y modificar datos de ejemplo. Los cambios se guardan únicamente en este navegador.</div><label>Contraseña de demostración<input type="password" id="admin-pass" autocomplete="current-password"></label><button class="sm" id="admin-login" style="margin-top:12px">Entrar</button>`:`<h4>Entorno de demostración</h4><div class="tip">No hay conexión con PHP, SQLite ni GitHub. Los cambios se guardan localmente en este navegador y no afectan a la web real.</div><p>Esta demo permite probar el aspecto y la navegación del administrador, editar contenidos, cambiar visibilidades y simular publicaciones.</p><h4>Publicación simulada</h4><p>Al publicar se crea una versión local de demostración. No se publica nada en Internet.</p><button class="sm" id="publish-now">Simular publicación</button><h4>Sesión</h4><button class="sm red" id="admin-logout">Cerrar sesión</button>`}<div style="text-align:right;margin-top:28px;font-size:.8rem;color:var(--mut)">Portosín ${APP_VERSION}</div>`;
}
function openDlg(){const d=$('#dlg'),adm=isAdmin(),sc=d.scrollTop;if(!adm)tab='con';
 const T=adm?[['visibilidad','Visibilidad'],['inicio','Inicio'],['carta','Carta'],['galeria','Galería'],['contacto','Contacto'],['historial','Historial'],['con','Sistema']]:[['con','Acceso']];
 d.innerHTML=`<div class="dh"><b>Configuración</b><span class="st" id="st"></span><button class="sm" id="x">Cerrar</button></div><div class="tabs">${T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div><div class="db">${tabHtml()}</div>`;
 if(!d.open)d.showModal();d.scrollTop=sc}
const dlg=$('#dlg');
dlg.addEventListener('click',async e=>{const t=e.target;
 if(t.id==='x')return dlg.close();
 if(t.dataset.t){tab=t.dataset.t;openDlg();dlg.scrollTop=0;return}
 if(t.closest('[data-calt]')){calOpen=!calOpen;return openDlg()}
 if(t.dataset.mkimg){const mode=t.dataset.mkimg;setSt('Creando imagen…');
  try{const blob=await menuImage(selD);if(!blob)throw new Error('sin menú');const name='menu-portosin-'+selD+'.png',url=URL.createObjectURL(blob);
   const pv=$('#mimg');if(pv){pv.src=url;$('#mprev').style.display='block'}
   if(mode==='share'){const f=new File([blob],name,{type:'image/png'});try{await navigator.share({files:[f],title:'Menú Portosín'})}catch(err){if(err&&err.name!=='AbortError')throw err}}
   else{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Imagen descargada')}
   setSt('')}catch(err){setSt('No se pudo crear la imagen',true)}return}
 if(t.dataset.d){selD=t.dataset.d;calOpen=false;const q=selD.split('-');calY=+q[0];calM=+q[1]-1;return openDlg()}
 if(t.dataset.cal){calM+=+t.dataset.cal;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}return openDlg()}
 if(t.dataset.mk){const k=t.dataset.mk,M=S.carta.menus,ks=Object.keys(M).sort();
  if(k==='copy'||k==='blank'){const prev=ks.filter(x=>x<selD).pop()||ks.pop(),b=JSON.parse(JSON.stringify(prev?M[prev]:EX));M[selD]=k==='copy'?b:Object.assign(b,{primeros:[],segundos:[],postres:''})}
  else if(k==='del'){if(!confirm('¿Borrar el menú de este día?'))return;delete M[selD]}
  else if(k==='prune'){const tk=todayKey(),old=ks.filter(x=>x<tk);if(!old.length)return toast('No hay menús pasados');if(!confirm('¿Borrar '+old.length+' menú(s) de días pasados?'))return;old.forEach(x=>delete M[x])}
  save();repaint();return openDlg()}
 if(t.dataset.go){dlg.close();location.hash='#'+t.dataset.go;return}
 if(t.dataset.up){up=t.dataset.up;$('#file').value='';return $('#file').click()}
 if(t.id==='addg'){$('#files').value='';return $('#files').click()}
 if(t.dataset.g){const a=S.galeria.items,i=+t.dataset.i,k=t.dataset.g;if(k==='d'){if(!confirm('¿Quitar esta foto de la galería?'))return;a.splice(i,1)}else{const j=k==='l'?i-1:i+1;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}save();repaint();return openDlg()}
 if(t.id==='admin-login'){const pw=$('#admin-pass')?.value||'';setSt('Comprobando acceso…');try{await apiPost({action:'auth',password:pw});serverAdmin=true;await pull();tab='visibilidad';repaint();openDlg();toast('Sesión iniciada')}catch(err){setSt(err.message,true)}return}
 if(t.id==='publish-now'){if(!confirm('Los cambios guardados se harán visibles para todos los visitantes. ¿Publicar ahora?'))return;try{await apiPost({action:'publish'});await pull();repaint();toast('Cambios publicados en la web');setSt('Publicación completada')}catch(err){setSt(err.message,true)}return}
 if(t.dataset.restore){if(!confirm('Se recuperará esta versión como borrador. La web pública no cambiará hasta que vuelvas a publicar. ¿Continuar?'))return;try{await apiPost({action:'restore',version_id:+t.dataset.restore});await pull();tab='visibilidad';repaint();openDlg();toast('Versión recuperada como borrador')}catch(err){setSt(err.message,true)}return}
 if(t.id==='admin-logout'){try{await apiPost({action:'logout'})}catch(_){}serverAdmin=false;sessionStorage.removeItem('pt_gear');repaint();return dlg.close()}
 if(t.id==='migrate-now'){if(DEMO_MODE){toast('Migración desactivada en la demo');return}if(!confirm('Se copiarán los datos de GitHub a SQLite. No se borrará el JSON original. ¿Continuar?'))return;try{setSt('Migrando…');const j=await migrateFromGitHub();setSt('Migración completada');toast('Datos migrados a SQLite');tab='visibilidad';openDlg()}catch(err){setSt(err.message,true)}return}
});
dlg.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){const v=t.dataset.list?t.value.split('\n').map(x=>x.trim()).filter(Boolean):t.value;sp(S,t.dataset.p,v);save();repaint()}});
dlg.addEventListener('change',e=>{const t=e.target;if(t.dataset.c){sp(S,t.dataset.c,t.checked);save();repaint()}if(t.dataset.vis){S.visibilidad=S.visibilidad||{};S.visibilidad[t.dataset.vis]=t.checked;save();repaint();openDlg()}});
let up='';
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{sp(S,up,await shrink(f,up.includes('hero')?1600:1280));save();repaint();openDlg()}catch(err){toast(err.message)}});
$('#files').addEventListener('change',async e=>{let n=0;for(const f of e.target.files){try{S.galeria.items.push(await shrink(f));n++}catch(_){}}if(n){save();repaint();openDlg();toast(n+' foto(s) añadida(s)')}});
$('#gear').onclick=()=>{tab=isAdmin()?'inicio':'con';openDlg()};
let tap=[];
document.addEventListener('click',e=>{
 if(e.target.matches('#foot img')){const n=Date.now();tap=tap.filter(x=>n-x<4000);tap.push(n);if(tap.length>=5){tap=[];sessionStorage.setItem('pt_gear','1');$('#gear').hidden=false;toast('Configuración activada')}}
 if(e.target.id==='ed'){tab='inicio';openDlg()}
 if(e.target.matches('.grid img')){const l=$('#lb');l.querySelector('img').src=e.target.src;l.classList.add('open')}
 if(e.target.closest('#lb'))$('#lb').classList.remove('open')});
$('#burger').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#lb').classList.remove('open');$('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false')}else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.grid img')){e.preventDefault();e.target.click()}});
let lastK=todayKey();const tick=()=>{const k=todayKey();if(k!==lastK){lastK=k;repaint()}};
setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
addEventListener('hashchange',route);
addEventListener('online',async()=>{await pull();repaint();toast('Conexión recuperada; contenidos actualizados')});
(async()=>{const cp=Promise.resolve({});
 let had=false;try{const c=LS.getItem('pt_cache');if(c){S=merge(DEF,JSON.parse(c));had=true}}catch(e){}
 if(had)route();CONF=await cp;const before=JSON.stringify(S);await pull();
 // La sesión del administrador se comprueba con una petición protegida al intentar guardar; no se guarda contraseña localmente.
 if(!had)route();else if(JSON.stringify(S)!==before)repaint();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
